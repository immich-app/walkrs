name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  format-lint:
    name: Lint, format, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install dependencies
        run: pnpm install
      - name: Check rust linting
        run: pnpm rust:lint
        if: ${{ !cancelled() }}
      - name: Check rust formatting
        run: pnpm rust:format
        if: ${{ !cancelled() }}
      - name: Run Rust tests
        run: cargo test
        if: ${{ !cancelled() }}
      - name: Check ts linting
        run: pnpm ts:lint
        if: ${{ !cancelled() }}
      - name: Check ts formatting
        run: pnpm ts:format
        if: ${{ !cancelled() }}
      - name: Build
        run: pnpm build
        if: ${{ !cancelled() }}
      - name: Check TypeScript types
        run: pnpm check
        if: ${{ !cancelled() }}
      - name: Run tests
        run: pnpm test
        if: ${{ !cancelled() }}
