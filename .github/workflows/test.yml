name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  format-lint:
    name: Lint, format, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@caac7f7e4298458a14238959504f411fc6cc7f06 # use-mise-action-v3.2.3
      - name: Install dependencies
        run: pnpm install
      - name: Check rust linting
        run: pnpm rust:lint
        if: ${{ !cancelled() }}
      - name: Check rust formatting
        run: pnpm rust:format
        if: ${{ !cancelled() }}
      - name: Run Rust tests
        run: cargo test
        if: ${{ !cancelled() }}
      - name: Check ts linting
        run: pnpm ts:lint
        if: ${{ !cancelled() }}
      - name: Check ts formatting
        run: pnpm ts:format
        if: ${{ !cancelled() }}
      - name: Build
        run: pnpm build
        if: ${{ !cancelled() }}
      - name: Check TypeScript types
        run: pnpm check
        if: ${{ !cancelled() }}
      - name: Run tests
        run: pnpm test
        if: ${{ !cancelled() }}
