[package]
name = "walkrs"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3.8.3", features = ["async"] }
napi-derive = "3.5.2"
tokio = { version = "1", features = ["sync"] }
ignore = { version = "=0.4.33", path = "vendor/ignore", features = ["directory-summary"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
napi-build = "2.3.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
